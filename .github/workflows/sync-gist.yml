name: Sync Gist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync from upstream Gist
        shell: bash
        run: |
          set -e

          GIST_ID="d65ef7ed5fed7049f599e7a863f197db"
          GIST_OWNER="thanksshu"
          GIST_REPO="https://gist.github.com/${GIST_OWNER}/${GIST_ID}.git"
          TARGET_FILE="check_cf_warp_endpoint.py"

          echo "=== Clone upstream Gist ==="

          rm -rf /tmp/upstream-gist

          git clone --quiet "$GIST_REPO" /tmp/upstream-gist

          cd /tmp/upstream-gist

          UPSTREAM_SHA=$(git rev-parse HEAD)
          UPSTREAM_DATE=$(git log -1 --format='%cI')
          UPSTREAM_DATE_UTC=$(git log -1 --date=format:'%Y-%m-%d %H:%M:%S UTC' --format='%cd')
          UPSTREAM_MESSAGE=$(git log -1 --format='%s')

          echo "Upstream commit : $UPSTREAM_SHA"
          echo "Upstream date   : $UPSTREAM_DATE_UTC"
          echo "Upstream message: $UPSTREAM_MESSAGE"

          cd "$GITHUB_WORKSPACE"

          echo "=== Compare Python file ==="

          FILE_CHANGED=false

          # ==========================================================
          # 上游文件存在
          # ==========================================================
          if [ -f "/tmp/upstream-gist/$TARGET_FILE" ]; then

            if [ -f "$TARGET_FILE" ] && cmp -s \
                "$TARGET_FILE" \
                "/tmp/upstream-gist/$TARGET_FILE"; then

              echo "Python file already up to date."

            else

              echo "=== Upstream file added or changed ==="

              cp "/tmp/upstream-gist/$TARGET_FILE" "$TARGET_FILE"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add "$TARGET_FILE"

              git commit \
                -m "Sync check_cf_warp_endpoint.py from upstream Gist" \
                -m "Upstream commit: $UPSTREAM_SHA" \
                -m "Upstream date: $UPSTREAM_DATE_UTC" \
                -m "Upstream message: $UPSTREAM_MESSAGE"

              git push origin main

              FILE_CHANGED=true

              echo "=== Python file sync completed ==="
            fi

          # ==========================================================
          # 上游文件不存在
          #
          # 原作者删除文件：
          #     删除本地对应文件
          #
          # 如果本地本来就没有：
          #     不做任何操作
          # ==========================================================
          else

            echo "Upstream file does not exist."

            if [ -f "$TARGET_FILE" ]; then

              echo "=== Upstream file was deleted ==="
              echo "Deleting local file: $TARGET_FILE"

              rm "$TARGET_FILE"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add "$TARGET_FILE"

              git commit \
                -m "Sync deletion of check_cf_warp_endpoint.py from upstream Gist" \
                -m "Upstream commit: $UPSTREAM_SHA" \
                -m "Upstream date: $UPSTREAM_DATE_UTC" \
                -m "Upstream message: $UPSTREAM_MESSAGE"

              git push origin main

              FILE_CHANGED=true

              echo "=== Python file deletion synced ==="

            else

              echo "Local file also does not exist."
              echo "No file sync required."

            fi
          fi

          # ==========================================================
          # 40 天维护仓库活动
          #
          # heartbeat 文件：
          # .github/sync-heartbeat
          #
          # 如果距离上一次 heartbeat >= 40 天，
          # 创建一次维护 commit。
          # ==========================================================

          echo "=== Check 40-day repository activity ==="

          HEARTBEAT_FILE=".github/sync-heartbeat"

          mkdir -p .github

          if [ -f "$HEARTBEAT_FILE" ]; then
            LAST_HEARTBEAT=$(cat "$HEARTBEAT_FILE")

            LAST_HEARTBEAT_TS=$(
              date -d "$LAST_HEARTBEAT" +%s 2>/dev/null || echo 0
            )
          else
            LAST_HEARTBEAT_TS=0
          fi

          NOW_TS=$(date +%s)

          if [ "$LAST_HEARTBEAT_TS" -eq 0 ]; then
            DAYS=999
          else
            DAYS=$(( (NOW_TS - LAST_HEARTBEAT_TS) / 86400 ))
          fi

          echo "Days since last heartbeat: ${DAYS}"

          if [ "$DAYS" -ge 40 ]; then

            NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating heartbeat: ${NOW_UTC}"

            printf '%s\n' "$NOW_UTC" > "$HEARTBEAT_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$HEARTBEAT_FILE"

            git commit \
              -m "chore: keep repository active"

            git push origin main

            echo "=== Heartbeat commit completed ==="

          else

            echo "No heartbeat required."

          fi

          echo "=== Sync completed ==="
